helix {

  bronze {
    # Raw landing zone — always append; never mutate the source-of-truth records.
    output-path       = "data/bronze/sarscov2"
    partition-columns = ["ingest_date", "source_system"]
    write-mode        = "append"
  }

  silver {
    # Cleansed and deduplicated view.
    # Overwrite the affected partition on each run so the step is idempotent.
    output-path       = "data/silver/sarscov2"
    partition-columns = ["collection_year", "source_system"]
    write-mode        = "overwrite"
  }

  gold {
    # Aggregated analytics layer — fully recomputed and overwritten on each run.
    output-path       = "data/gold/sarscov2_agg"
    partition-columns = ["collection_year"]
    write-mode        = "overwrite"
  }

  # Columns that uniquely identify a sequencing record.
  # The Silver layer uses these to resolve duplicates, keeping the
  # row with the latest ingest_ts when multiple copies arrive.
  dedup-keys = ["sample_id", "collection_date", "source_system"]
}
